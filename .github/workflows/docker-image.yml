name: Docker Image CI

on:
  release:
    types: [created]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: l9bot-environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log username
        run:
          echo "docker hub username ${{ vars.DOCKER_HUB_USERNAME }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Path to Dockerfile and build context
          push: true
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
          tags: |
            ${{ vars.DOCKER_HUB_USERNAME }}/l9bot:latest
            ${{ vars.DOCKER_HUB_USERNAME }}/l9bot:${{ github.ref_name }}